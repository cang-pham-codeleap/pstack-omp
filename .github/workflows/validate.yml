name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The validator reads the tree and its manifests. It needs no account, so this runs on a fork.
      - run: npm install -g '@anthropic-ai/claude-code@^2'

      - name: validate the plugin
        run: |
          claude plugin validate .
          claude plugin validate ./agents
          claude plugin validate ./skills

      - name: guard the dual-harness contract
        run: bash scripts/check-harness-contract.sh
